<div id="promaster-ai-widget" class="ai-widget-container">
  <!-- Chat Floating Action Button -->
  <button id="ai-toggle-btn" class="ai-fab" title="دستیار هوشمند کاوه (Kaveh AI)">
    <div class="ai-fab-icon-box">
      <i class="fas fa-robot"></i>
    </div>
    <span class="ai-fab-badge">کاوه</span>
  </button>

  <!-- Chat Window -->
  <div id="ai-chat-window" class="ai-window hidden">
    <!-- Header -->
    <div class="ai-header">
      <div class="ai-header-brand">
        <div class="ai-avatar-circle">
          <i class="fas fa-brain"></i>
        </div>
        <div class="ai-header-titles">
          <div class="ai-title-main">
            <span>دستیار هوشمند کاوه</span>
            <span class="ai-status-dot" title="آنلاین و آماده پاسخ‌گویی"></span>
          </div>
          <span class="ai-title-sub">همیار تحلیلی {{ org_name }}</span>
        </div>
      </div>
      <div class="ai-header-actions">
        <button id="ai-clear-btn" class="ai-action-btn" title="پاک کردن پیام‌ها">
          <i class="fas fa-trash-alt"></i>
        </button>
        <button id="ai-close-btn" class="ai-action-btn" title="بستن پنجره">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Quick Suggestions Bar -->
    <div class="ai-suggestions-bar">
      <button class="ai-suggestion-chip" onclick="askSuggestion('آخرین مصوبات شورا و هیئت رئیسه چیست؟')">
        📜 آخرین مصوبات
      </button>
      <button class="ai-suggestion-chip" onclick="askSuggestion('امروز چه جلساتی داریم؟')">
        👥 جلسات امروز
      </button>
      <button class="ai-suggestion-chip" onclick="askSuggestion('وضعیت تفاهم‌نامه‌ها و امور اجرایی چگونه است؟')">
        🤝 تفاهم‌نامه‌ها
      </button>
      <button class="ai-suggestion-chip" onclick="askSuggestion('وظایف در جریان {{ org_name }} کدامند؟')">
        ⚡ وظایف معوق
      </button>
    </div>

    <!-- Messages Container -->
    <div id="ai-messages" class="ai-messages">
      <div class="ai-message ai-bot">
        <div class="ai-msg-avatar"><i class="fas fa-robot"></i></div>
        <div class="ai-msg-content">
          سلام! من <strong>«کاوه»</strong>، دستیار هوشمند {{ org_name }} هستم.<br><br>
          می‌توانید هر سوالی درباره <strong>مصوبات شورا</strong>، <strong>جلسات</strong>، <strong>تفاهم‌نامه‌ها</strong> یا <strong>وظایف سازمانی</strong> دارید از من بپرسید.
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="ai-input-area">
      <input type="text" id="ai-input" placeholder="از کاوه بپرسید (مثلاً: آخرین مصوبات را نشان بده)..." autocomplete="off">
      <button id="ai-send-btn" title="ارسال پرسش">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('ai-toggle-btn');
    const closeBtn = document.getElementById('ai-close-btn');
    const clearBtn = document.getElementById('ai-clear-btn');
    const windowEl = document.getElementById('ai-chat-window');
    const inputEl = document.getElementById('ai-input');
    const sendBtn = document.getElementById('ai-send-btn');
    const messagesEl = document.getElementById('ai-messages');

    function toggleChat() {
      windowEl.classList.toggle('hidden');
      if (!windowEl.classList.contains('hidden')) {
        setTimeout(() => inputEl.focus(), 150);
      }
    }

    toggleBtn.addEventListener('click', toggleChat);
    closeBtn.addEventListener('click', toggleChat);

    clearBtn.addEventListener('click', () => {
      messagesEl.innerHTML = `
        <div class="ai-message ai-bot">
          <div class="ai-msg-avatar"><i class="fas fa-robot"></i></div>
          <div class="ai-msg-content">
            سلام! من <strong>«کاوه»</strong>، دستیار هوشمند {{ org_name }} هستم.<br><br>
            هر پرسشی درباره مصوبات، جلسات یا آمار و اطلاعات سازمانی دارید، در خدمتم.
          </div>
        </div>
      `;
    });

    window.askSuggestion = function(text) {
      inputEl.value = text;
      sendMessage();
    };

    function formatMarkdown(text) {
      if (!text) return '';
      // Escape basic HTML
      let html = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Bold text **bold**
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      // Resolution tags [مصوبه #123]
      html = html.replace(/\[مصوبه #(\d+)\]/g, '<span class="badge badge-secondary" style="font-size:11px;margin:0 2px;">مصوبه #$1</span>');
      // Bullet points
      html = html.replace(/^[\*\•\-]\s+(.*)$/gm, '<div style="margin-right:12px;margin-bottom:3px;">• $1</div>');
      // Line breaks
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage(text, 'user', false);
      inputEl.value = '';

      const loadingId = appendMessage(
        '<div class="ai-thinking-box"><div class="ai-spinner"></div><span>کاوه در حال تفکر و پردازش...</span></div>',
        'bot',
        true
      );

      try {
        const resp = await fetch('/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await resp.json();

        const loadingElem = document.getElementById(loadingId);
        if (loadingElem) loadingElem.remove();

        if (data.error) {
          appendMessage('⚠️ ' + data.error, 'bot', false);
        } else {
          appendMessage(data.response, 'bot', true);
        }
      } catch (e) {
        const loadingElem = document.getElementById(loadingId);
        if (loadingElem) loadingElem.remove();
        appendMessage('خطا در برقراری ارتباط با سرور. لطفاً مجدداً تلاش کنید.', 'bot', false);
      }
    }

    function appendMessage(content, sender, isHtml) {
      const msgId = 'msg-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5);
      const div = document.createElement('div');
      div.className = `ai-message ai-${sender}`;
      div.id = msgId;

      const avatarHtml = sender === 'bot' ? '<div class="ai-msg-avatar"><i class="fas fa-robot"></i></div>' : '';
      const formatted = isHtml ? formatMarkdown(content) : document.createTextNode(content).textContent;

      div.innerHTML = `
        ${avatarHtml}
        <div class="ai-msg-content">${isHtml ? content : formatted}</div>
      `;

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return msgId;
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  });
</script>
