{% extends "base.html" %}

{% block title %}چارت سازمانی{% endblock %}

{% block content %}
<style>
    #tree {
        width: 100%;
        height: 800px;
        background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        /* Blue Gradient Background */
        border-radius: 12px;
        overflow: hidden;
    }

    /* OrgChart.js Customization for Glassmorphism */
    [node-id] rect {
        fill: rgba(255, 255, 255, 0.15) !important;
        stroke: rgba(255, 255, 255, 0.5) !important;
        stroke-width: 1.5px !important;
        rx: 12;
        ry: 12;
        backdrop-filter: blur(8px);
    }

    [node-id] text {
        fill: #ffffff !important;
        /* White Text for contrast on blue */
        font-family: 'Vazir', sans-serif;
    }
</style>

<div class="container-fluid mt-4">
    <div class="row mb-3">
        <div class="col-12 text-center">
            <h2 class="text-dark fw-bold">نمودار سازمانی {{ org_name }}</h2>
        </div>
    </div>

    <div class="card shadow-lg border-0">
        <div class="card-body p-0">
            <div id="tree"></div>
        </div>
    </div>
</div>

<!-- Load D3.js (Local) -->
<script src="{{ url_for('static', filename='js/d3.min.js') }}"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const width = document.getElementById("tree").clientWidth;
        const height = 800;

        const svg = d3.select("#tree").append("svg")
            .attr("width", width)
            .attr("height", height)
            .call(d3.zoom().on("zoom", (event) => {
                g.attr("transform", event.transform);
            }))
            .append("g");

        const g = svg.append("g");

        // Fetch Data
        fetch('/org_chart/data')
            .then(response => response.json())
            .then(data => {
                if (data.length === 0) {
                    document.getElementById("tree").innerHTML = '<div class="text-white text-center p-5">هیچ داده‌ای یافت نشد.</div>';
                    return;
                }

                // Convert flat data to hierarchy
                const stratify = d3.stratify()
                    .id(d => d.id)
                    .parentId(d => d.pid);

                let root;
                try {
                    root = stratify(data);
                } catch (e) {
                    console.error("Hierarchy Error:", e);
                    document.getElementById("tree").innerHTML = '<div class="alert alert-danger text-center">خطا در سلسله مراتب داده‌ها (Data Hierarchy Error).</div>';
                    return;
                }

                // Layout: Horizontal Tree
                // reduced vertical spacing (x from 300 -> 90)
                const tree = d3.tree().nodeSize([90, 350]);
                tree(root);

                // Center the Tree
                // Find min/max X coordinates to center vertically
                let x0 = Infinity;
                let x1 = -x0;
                root.each(d => {
                    if (d.x > x1) x1 = d.x;
                    if (d.x < x0) x0 = d.x;
                });

                // Translate: Move right by 100px (padding), Center vertically based on tree height
                const initialY = (height / 2) - ((x1 + x0) / 2);
                g.attr("transform", `translate(150, ${initialY})`);

                // Update zoom identity
                const zoom = d3.zoom().on("zoom", (event) => {
                    g.attr("transform", event.transform);
                });
                d3.select("svg").call(zoom.transform, d3.zoomIdentity.translate(150, initialY).scale(0.8));


                // Links
                g.selectAll(".link")
                    .data(root.links())
                    .enter().append("path")
                    .attr("class", "link")
                    .attr("fill", "none")
                    .attr("stroke", "rgba(255,255,255,0.6)")
                    .attr("stroke-width", 1.5)
                    .attr("d", d3.linkHorizontal()
                        .x(d => d.y)
                        .y(d => d.x));

                // Nodes
                const node = g.selectAll(".node")
                    .data(root.descendants())
                    .enter().append("g")
                    .attr("class", d => "node" + (d.children ? " node--internal" : " node--leaf"))
                    .attr("transform", d => `translate(${d.y},${d.x})`);

                // Glassmorphism Card
                node.append("rect")
                    .attr("width", 280)
                    .attr("height", 80)
                    .attr("x", -20)
                    .attr("y", -40)
                    .attr("rx", 12)
                    .attr("ry", 12)
                    .attr("fill", "rgba(255,255,255,0.15)")
                    .attr("stroke", "rgba(255,255,255,0.6)")
                    .attr("stroke-width", 1)
                    .style("cursor", "pointer");

                // Name
                node.append("text")
                    .attr("dy", -5)
                    .attr("x", 120)
                    .style("text-anchor", "middle")
                    .style("font-family", "Vazir")
                    .style("font-size", "15px")
                    .style("font-weight", "bold")
                    .style("fill", "#ffffff")
                    .text(d => d.data.name);

                // Title
                node.append("text")
                    .attr("dy", 20)
                    .attr("x", 120)
                    .style("text-anchor", "middle")
                    .style("font-family", "Vazir")
                    .style("font-size", "11px")
                    .style("fill", "rgba(255,255,255,0.8)")
                    .text(d => d.data.title ? d.data.title.substring(0, 35) : "");

                // Mobile
                node.append("text")
                    .attr("dy", 35)
                    .attr("x", 120)
                    .style("text-anchor", "middle")
                    .style("font-family", "Vazir")
                    .style("font-size", "11px")
                    .style("fill", "#555")
                    .text(d => d.data.mobile || "");

            })
            .catch(err => {
                console.error(err);
                document.getElementById("tree").innerHTML = '<div class="alert alert-danger text-center">خطا: ' + err + '</div>';
            });
    });
</script>
{% endblock %}
