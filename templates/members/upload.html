{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6">
        <div class="glass-card">
            <div class="card-header bg-transparent border-bottom border-white-10 py-3">
                <h5 class="text-white mb-0">
                    <i class="fas fa-file-excel me-2"></i>بارگذاری لیست اعضا
                </h5>
            </div>
            <div class="card-body">
                <div class="alert alert-info border-0 bg-white-10 text-white mb-4">
                    <i class="fas fa-info-circle me-2"></i>
                    لطفاً فایلی با سرستون‌های زیر بارگذاری کنید:
                    <br>
                    <strong>Name (نام), Phone (شماره تماس), Birthday (تاریخ تولد)</strong>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="mb-4">
                        <label for="file" class="form-label text-white">فایل اکسل (.xlsx)</label>
                        <input type="file" class="form-control bg-transparent text-white border-white-10" id="file"
                            name="file" accept=".xlsx, .xls" required>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="replace" name="replace" checked>
                        <label class="form-check-label text-white" for="replace">
                            لیست قبلی کاملاً حذف و جایگزین شود
                        </label>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('members.birthdays') }}" class="btn btn-outline-light">بازگشت</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-upload me-2"></i> شروع پردازش
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
