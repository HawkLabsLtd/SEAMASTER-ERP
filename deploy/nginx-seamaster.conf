# =============================================================================
# Clean Nginx Configuration for SeaMaster (Root Path Setup)
# Target: /opt/seamaster
# Backend: Gunicorn on 127.0.0.1:8000
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # MIME types & Global Defaults
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Client body size for file/excel uploads
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 1. Direct Static Files Serving with App Proxy Fallback
    location /static/ {
        alias /opt/seamaster/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @proxy_to_app;
    }

    # 2. Direct Favicon with App Proxy Fallback
    location = /favicon.ico {
        alias /opt/seamaster/static/favicon.ico;
        try_files $uri @proxy_to_app;
        access_log off;
        log_not_found off;
    }

    # 3. All Other Requests Proxy to Gunicorn
    location / {
        try_files $uri @proxy_to_app;
    }

    location @proxy_to_app {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Dash and real-time components)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
    }
}
